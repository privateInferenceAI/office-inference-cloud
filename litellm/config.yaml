# LiteLLM gateway config — Office Inference Cloud
# The whole point of this variant: the model is a part number, not an architecture.
# Swap provider/model here; the rest of the stack (guardrails, RAG, workflows) is unchanged.

model_list:
  # Chat model behind the company-ai alias (the ONLY name clients see).
  # Identifiers verified against vendor docs 2026-09-15 — re-verify before each deploy.
  - model_name: company-ai
    litellm_params:
      model: moonshot/kimi-k2.6          # default chat: Kimi K2.6 (~$0.55/$2.31 per 1M).
      # Moonshot's API is OpenAI-compatible; if a region endpoint is ever needed:
      # api_base: https://api.moonshot.ai/v1
      # alternatives: openai/gpt-6-astra (flagship) / gpt-5.6-sol / gpt-5.6-terra (+ OPENAI_API_KEY)
      #               anthropic/claude-fable-5-1 / claude-opus-5 / claude-sonnet-5 (+ ANTHROPIC_API_KEY)
      #               gemini/gemini-3.1-pro-preview / gemini-3.8-flash (+ GEMINI_API_KEY)
      api_key: os.environ/MOONSHOT_API_KEY

  # Embeddings behind the company-embed alias (guardrails + ingestion call this).
  # NOTE: Moonshot has NO embeddings API — embeddings stay on OpenAI, so .env
  # carries TWO provider keys (MOONSHOT_API_KEY for chat, OPENAI_API_KEY for embeddings).
  - model_name: company-embed
    litellm_params:
      model: openai/text-embedding-3-large   # 3072 dims — must match ingestion VECTOR_SIZE
      api_key: os.environ/OPENAI_API_KEY
      # cheaper: openai/text-embedding-3-small (1536 dims → VECTOR_SIZE "1536")
      # non-OpenAI option: voyage/voyage-embed-4 (+ VOYAGE_API_KEY)

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
